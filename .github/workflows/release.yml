name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  checks:
    uses: ./.github/workflows/checks.yml
  publish:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - name: Match release tag to package version
        run: python -c 'import json,os; expected="v"+json.load(open("plugin.json"))["version"]; assert os.environ["RELEASE_TAG"] == expected, f"expected {expected}"'
      - run: python scripts/distribution.py build
      - name: Publish complete immutable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/publish_release.py
